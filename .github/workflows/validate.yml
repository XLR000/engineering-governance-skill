name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package metadata and hygiene
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("skills/governing-engineering-delivery")
          required = {
              "SKILL.md",
              "agents/openai.yaml",
              "assets/context-pack.md",
              "references/project-adapter.md",
          }
          actual = {
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file()
          }
          if actual != required:
              raise SystemExit(f"Unexpected package files: {sorted(actual ^ required)}")

          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          frontmatter = re.match(r"^---\n(.*?)\n---", skill, re.DOTALL)
          if not frontmatter:
              raise SystemExit("SKILL.md frontmatter is missing")
          name = re.search(r"^name:\s*([^\n]+)$", frontmatter.group(1), re.MULTILINE)
          description = re.search(r"^description:\s*([^\n]+)$", frontmatter.group(1), re.MULTILINE)
          if not name or name.group(1).strip() != "governing-engineering-delivery":
              raise SystemExit("Skill name is invalid")
          if not description or not description.group(1).strip().startswith("Use when"):
              raise SystemExit("Skill description must start with 'Use when'")
          if len(frontmatter.group(1)) > 1024:
              raise SystemExit("Skill frontmatter exceeds 1024 characters")

          prohibited = [
              re.compile("/" + "Users" + "/"),
              re.compile("SEO" + ":" + "GEO", re.IGNORECASE),
              re.compile("-" * 5 + r"BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY" + "-" * 5),
              re.compile(r"\b" + "sk" + r"-[A-Za-z0-9_-]{20,}\b"),
          ]
          sensitive_files = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix == ".pyc":
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              if any(pattern.search(text) for pattern in prohibited):
                  sensitive_files.append(str(path))
          if sensitive_files:
              print("Potential sensitive or non-portable content found in:")
              print("\n".join(sensitive_files))
              raise SystemExit(1)

          for path in root.rglob("*"):
              if path.is_file() and "assets" not in path.parts:
                  if "{{" in path.read_text(encoding="utf-8", errors="ignore"):
                      raise SystemExit(f"Unresolved placeholder outside template asset: {path}")
          PY
